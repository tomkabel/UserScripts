# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths-ignore:
      - 'Pagetual/items_all.json'
      - 'Pagetual/pagetualRules.json'
      - '.github/*'
      - '.github/*/*'
  workflow_run:
    workflows: ["Update Version on File Change", "Sync Pagetual rules from upstream"]
    types:
        - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gate Pagetual rule files
        run: node .github/scripts/validate-pagetual.mjs files Pagetual
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Outside judge: what users actually download must be valid after every deploy.
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployed Pagetual rules
        run: |
          for i in 1 2 3 4 5; do
            node .github/scripts/validate-pagetual.mjs live "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/Pagetual/" && exit 0
            sleep 30
          done
          exit 1
