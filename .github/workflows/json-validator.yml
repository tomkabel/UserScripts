name: Validate Pagetual

on:
  push:
    paths:
      - 'Pagetual/**'
      - '.github/scripts/validate-pagetual.mjs'
  pull_request:
    paths:
      - 'Pagetual/**'
      - '.github/scripts/validate-pagetual.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rule files (JSON, schema, size floors)
        run: node .github/scripts/validate-pagetual.mjs files Pagetual

      - name: No upstream URLs in fork script/README
        run: node .github/scripts/validate-pagetual.mjs refs

      - name: Userscript parses
        run: node --check Pagetual/pagetual.user.js
