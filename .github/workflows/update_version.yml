name: Update Version on File Change

# Bumps Pagetual/version when rule files are pushed by hand without a version bump.
# The upstream sync bumps the version in its own commit.

on:
  push:
    branches: [master]
    paths:
      - 'Pagetual/items_all.json'
      - 'Pagetual/pagetualRules.json'

permissions:
  contents: write

concurrency:
  group: pagetual-rules
  cancel-in-progress: false

jobs:
  update_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version if rule files are newer than it
        run: |
          version_ts=$(git log -1 --format="%at" Pagetual/version)
          rules_ts=$(git log -1 --format="%at" -- Pagetual/items_all.json Pagetual/pagetualRules.json)
          if (( version_ts >= rules_ts )); then
            echo "Version already bumped."
            exit 0
          fi
          echo $(( $(cat Pagetual/version) + 1 )) > Pagetual/version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pagetual/version
          git commit -m "Update version of Pagetual rules to $(cat Pagetual/version)"
          git push
